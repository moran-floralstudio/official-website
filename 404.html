<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>找不到這個頁面｜默藍花藝設計</title>
  <!--
    Cloudflare Pages 有 404.html 時，不存在的網址會回 404 並顯示這頁；
    沒有的話會把首頁當成任何網址的內容回 200，搜尋引擎會把每個錯誤連結
    都當成重複的首頁（soft 404）。
  -->
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; --paper: #e9e4da; --ink: #14120f; --muted: rgba(20, 18, 15, .6); --line: rgba(20, 18, 15, .14); }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --paper: #14120f; --ink: #ede8de; --muted: rgba(237, 232, 222, .6); --line: rgba(237, 232, 222, .14); }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
      background: var(--paper); color: var(--ink);
      font-family: "Noto Serif TC", "PMingLiU", serif; font-weight: 300; line-height: 2; text-align: center;
    }
    .code { font-size: 13px; letter-spacing: .4em; color: var(--muted); }
    h1 { margin: 12px 0 8px; font-size: clamp(24px, 5vw, 34px); font-weight: 300; letter-spacing: .12em; }
    p { margin: 0 0 32px; color: var(--muted); }
    nav { display: flex; flex-wrap: wrap; gap: 12px 28px; justify-content: center; }
    a { color: inherit; text-decoration: none; padding-bottom: 4px; border-bottom: 1px solid var(--line); letter-spacing: .1em; }
    a:hover, a:focus-visible { border-color: currentColor; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>找不到這個頁面</h1>
    <p>網址可能已經變更，或是輸入時少了幾個字。</p>
    <nav aria-label="返回">
      <a href="/">回到默藍首頁</a>
      <a href="/#services">花藝服務</a>
      <a href="https://shop.moranfloral.tw/">線上花禮店</a>
    </nav>
  </main>
</body>
</html>
